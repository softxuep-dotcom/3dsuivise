<title>背包图标预览</title>
<style>

  h2 { margin:26px 0 10px; font-size:13px; color:#ffb35c; font-weight:800; letter-spacing:.06em; }
  h2:first-child { margin-top:0; }
  .grid { display:grid; grid-template-columns:repeat(4,110px); gap:8px; }
  .inventory-slot { position:relative; min-height:82px; padding:8px; border:1px solid rgba(207,229,236,.18);

  .item-icon { display:block; width:30px; height:30px; margin:0 auto 3px; }
  .item-name { display:block; color:#bcd0d6; font-size:10px; }
  .item-count { position:absolute; right:8px; bottom:6px; font-size:13px; font-weight:900; }
  .big .item-icon { width:96px; height:96px; }
  .big .inventory-slot { min-height:150px; }
  .big .grid { grid-template-columns:repeat(4,170px); }
  .note { margin-top:22px; padding:12px 14px; border-left:3px solid #ffb35c;
          background:rgba(255,179,92,.08); color:#d8c3a6; font-size:12px; }
</style>

  生肉与烤肉<b>故意共用同一个轮廓</b>，差别只在底下那簇火 —— 让玩家一眼看出它俩是同一样东西的两个状态。<br>
  仙人掌汁与水同理：同一个水滴轮廓，靠绿色和三根刺区分。<br>
  颜色取自世界里同一件东西的材质：肉 #9e3f3d、木 #7a4931、骨 #d7c8ad、仙人掌 #4f7a48。
