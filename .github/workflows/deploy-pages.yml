name: Deploy GitHub Pages

on:
  push:
    branches:
      # 几条线共用同一个仓库，也共用同一个 Pages 站点 —— **后推的覆盖先推的**，
      # 不是并存：main 是 codexdesign2 那条；lastcar 是在跑的 1.1.x；
      # v1.0.28 是从 1.0.28 拉出来补遥测的这条（分支名没跟着版本号走，现在是 1.2.28）。
      # 想看哪条就推哪条，或者用下面的 workflow_dispatch 手动指定 ref。
      - main
      - v1.0.28
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # 模拟层回归测试（约 40 秒）。挡的是一类 typecheck 和肉眼都看不见的毛病：
      # 狗卡在营地下面不上来咬、天亮撤不出去、营地大门被石头封死。
      # 这些只有把一整夜跑完再看统计量才发现，所以必须进 CI。
      - name: Test
        run: npm test

      - name: Build game
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
